
spring:
    application:
        name: demo-redis
    datasource:
      url: jdbc:postgresql://localhost:5432/redis_demo_db
      username: postgres
      password: 123456$
      driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          dialect: org.hibernate.dialect.PostgreSQLDialect

    data:
      redis:
        host: localhost
        port: 6379
server:
  port: 8088
